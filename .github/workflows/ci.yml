name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: encuentro
          POSTGRES_USER: encuentro
          POSTGRES_PASSWORD: encuentro
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U encuentro -d encuentro"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://encuentro:encuentro@localhost:5432/encuentro

    steps:
      - uses: actions/checkout@v6

      - name: Validar documentación canónica
        # Gate documental de P00. Corre primero: si los contratos no son
        # coherentes, el resto del pipeline no aporta información.
        run: python scripts/validate_canonical_docs.py

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          # Patch exacto, igual que .nvmrc y package.json#engines.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Pruebas unitarias
        run: pnpm test

      - name: Aplicar migraciones
        run: pnpm exec prisma migrate deploy

      - name: Pruebas de integración
        # Gate de P03: transiciones, concurrencia y aislamiento contra Postgres.
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Instalar navegador para E2E
        run: pnpm exec playwright install chromium --with-deps

      - name: Accesibilidad y responsive
        # Gate de P02: WCAG 2.2 AA sobre los cinco viewports canónicos.
        run: pnpm test:e2e

      - name: Publicar reporte de fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
