name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: encuentro
          POSTGRES_USER: encuentro
          POSTGRES_PASSWORD: encuentro
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U encuentro -d encuentro"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://encuentro:encuentro@localhost:5432/encuentro

      # El recorrido autenticado usa una base propia. La siembra deja catálogo
      # que la limpieza no retira, y para borrar los cargos apaga un disparador
      # de solo anexado: ninguna de las dos cosas sobre la base que acaban de
      # usar las pruebas de integración.
      E2E_DATABASE_URL: postgresql://encuentro:encuentro@localhost:5432/encuentro_e2e

      # El servidor del recorrido se levanta en 127.0.0.1:3100 y Better Auth
      # deriva de APP_URL sus orígenes de confianza; la configuración de
      # Playwright lo sobrescribe para el proceso hijo, pero la semilla lee el
      # entorno del job.
      APP_URL: http://127.0.0.1:3100

      # Valores de prueba, no secretos: la validación exige 32 caracteres.
      SESSION_SECRET: ci-session-secret-de-treinta-y-dos-o-mas
      RECEIPT_VERIFICATION_SECRET: ci-receipt-secret-de-treinta-y-dos-o-mas

      # No hay MinIO en CI. Se declaran porque `container.ts` los exige al
      # construir el almacén, y ninguna prueba del recorrido sube un archivo.
      OBJECT_STORAGE_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_BUCKET: encuentro-private
      OBJECT_STORAGE_ACCESS_KEY: ci-access-key
      OBJECT_STORAGE_SECRET_KEY: ci-secret-key

    steps:
      - uses: actions/checkout@v6

      - name: Validar documentación canónica
        # Gate documental de P00. Corre primero: si los contratos no son
        # coherentes, el resto del pipeline no aporta información.
        run: python scripts/validate_canonical_docs.py

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          # Patch exacto, igual que .nvmrc y package.json#engines.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Pruebas unitarias
        run: pnpm test

      - name: Aplicar migraciones
        run: pnpm exec prisma migrate deploy

      - name: Pruebas de integración
        # Gate de P03: transiciones, concurrencia y aislamiento contra Postgres.
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Instalar navegador para E2E
        run: pnpm exec playwright install chromium --with-deps

      - name: Preparar la base del recorrido
        # `pnpm db:e2e` crea esta base en local, pero lo hace a través de
        # `docker compose`, que aquí no existe: Postgres es un servicio del job.
        # El cliente `psql` viene con la imagen de ubuntu-latest.
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE encuentro_e2e'
          DATABASE_URL="$E2E_DATABASE_URL" pnpm exec prisma migrate deploy

      - name: Recorrido de extremo a extremo
        # Accesibilidad WCAG 2.2 AA sobre los cinco viewports (P02) y el
        # recorrido autenticado: acceso con segundo factor, fronteras de
        # autorización y humo de las pantallas con sesión.
        run: pnpm test:e2e

      - name: Publicar reporte de fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
