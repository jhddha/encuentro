packages:
  - apps/*
  - packages/*
allowBuilds:
  # Motores de consulta de Prisma; se descargan en postinstall.
  '@prisma/engines': true
  # Binario nativo de esbuild, usado por tsx para ejecutar TypeScript.
  esbuild: true
  # Acelerador nativo opcional de msgpackr, usado por BullMQ.
  msgpackr-extract: true
  prisma: true
  # Resolvedor nativo de módulos que usa el plugin de imports de ESLint.
  unrs-resolver: true
minimumReleaseAgeExclude:
  - bullmq@6.0.7
  - '@better-auth/core@1.6.26'
  - '@better-auth/drizzle-adapter@1.6.26'
  - '@better-auth/kysely-adapter@1.6.26'
  - '@better-auth/memory-adapter@1.6.26'
  - '@better-auth/mongo-adapter@1.6.26'
  - '@better-auth/prisma-adapter@1.6.26'
  - '@better-auth/telemetry@1.6.26'
  - better-auth@1.6.26
