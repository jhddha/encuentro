# Entorno de desarrollo local.
#
# DEC-001: en producción, PostgreSQL y Redis viven en la red privada de Docker y
# nunca se exponen a Internet. Aquí sí se publican puertos porque el host los
# necesita, pero solo sobre 127.0.0.1.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: encuentro
      POSTGRES_USER: encuentro
      POSTGRES_PASSWORD: encuentro
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U encuentro -d encuentro']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: encuentro-dev
      MINIO_ROOT_PASSWORD: encuentro-dev-secret
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
